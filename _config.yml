# Hexo 配置文件
## 文档: https://hexo.io/docs/configuration.html
## 源码: https://github.com/hexojs/hexo/

# 站点信息
title: BuerYouth
subtitle: 'Please believe, something beautiful is on its way!'
description: 'BuerYouth 的个人技术博客'
keywords:
author: BuerYouth
language: zh-CN
timezone: Asia/Shanghai

# URL
## 在此设置你的站点 URL。例如，使用 GitHub Pages 时，设置为 'https://username.github.io/project'
url: https://bueryouth.github.io
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# 目录
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# 写作设置
new_post_name: :title.md # 新文章的文件名
default_layout: post
titlecase: false # 是否将标题转换为标题格式
external_link:
  enable: true # 外部链接在新标签页中打开
  field: site # 应用到整个站点
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# 首页设置
# path: 博客索引页的根路径。（默认 = ''）
# per_page: 每页显示的文章数。（0 = 禁用分页）
# order_by: 文章排序方式。（默认按日期降序）
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# 分类与标签
default_category: uncategorized
category_map:
tag_map:

# 元数据元素
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# 日期 / 时间格式
## Hexo 使用 Moment.js 解析和显示日期
## 你可以参考以下文档自定义日期格式
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option 支持 'mtime', 'date', 'empty'
updated_option: 'mtime'

# 分页
## 将 per_page 设置为 0 以禁用分页
per_page: 10
pagination_dir: page

# 包含 / 排除文件
## include:/exclude: 选项仅适用于 'source/' 文件夹
include:
exclude:
ignore:

# 扩展
## 插件: https://hexo.io/plugins/
## 主题: https://hexo.io/themes/
theme: butterfly

# 部署
## 文档: https://hexo.io/docs/one-command-deployment
deploy:
  type: git
  repo: https://github.com/bueryouth/bueryouth.github.io.git
  branch: gh-pages
